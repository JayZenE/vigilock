<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vigilock</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header class="navbar">
        <div class="container navbar-inner">
            <a href="/" class="logo">
                <div class="logo-mark">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="VigiLock Logo">
                </div>
            </a>

            <nav aria-label="Primary navigation">
                <ul class="nav-links">
                    <li><a href="/">home</a></li>
                    <li><a href="/about">about</a></li>
                    <li><a href="/encrypt">encrypt</a></li>
                    <li><a href="/decrypt">decrypt</a></li>
                    <li><a href="/recovery">data recovery</a></li>
                    <li><a href="#" id="suggestImprovementsLink">suggest improvements</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-wrapper">
        <div class="container">
            <div class="content-shell">
                {% block hero %}{% endblock %}
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>

    <div id="redirectModal" class="error-modal" aria-hidden="true">
        <div class="error-modal__card" role="dialog" aria-modal="true" aria-labelledby="redirectModalTitle">
            <div class="error-modal__header">
                <h3 id="redirectModalTitle">External link</h3>
                <button id="redirectModalClose" class="error-modal__close" type="button" aria-label="Close confirmation">&times;</button>
            </div>
            <p class="error-modal__message">This button redirects you to an external site (linktr.ee). Confirm redirect?</p>
            <div class="error-modal__actions">
                <button id="redirectModalCancel" class="btn btn-secondary" type="button">Cancel</button>
                <button id="redirectModalConfirm" class="btn btn-primary" type="button">Continue</button>
            </div>
        </div>
    </div>

    <script>
        const suggestLink = document.getElementById('suggestImprovementsLink');
        const redirectModal = document.getElementById('redirectModal');
        const redirectModalClose = document.getElementById('redirectModalClose');
        const redirectModalCancel = document.getElementById('redirectModalCancel');
        const redirectModalConfirm = document.getElementById('redirectModalConfirm');
        const pendingRedirectUrl = 'https://linktr.ee/vigilocksuggestions';

        if (suggestLink) {
            suggestLink.addEventListener('click', function (event) {
                event.preventDefault();
                redirectModal.style.display = 'flex';
                redirectModal.setAttribute('aria-hidden', 'false');
            });
        }

        function closeRedirectModal() {
            redirectModal.style.display = 'none';
            redirectModal.setAttribute('aria-hidden', 'true');
        }

        [redirectModalClose, redirectModalCancel].forEach((button) => {
            if (button) {
                button.addEventListener('click', closeRedirectModal);
            }
        });

        if (redirectModalConfirm) {
            redirectModalConfirm.addEventListener('click', function () {
                closeRedirectModal();
                window.open(pendingRedirectUrl, '_blank', 'noopener,noreferrer');
            });
        }
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
